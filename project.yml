name: Kamera
options:
  bundleIdPrefix: com.kamera
  deploymentTarget:
    macOS: "14.4"
  xcodeVersion: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  Yams:
    url: https://github.com/jpsim/Yams
    from: "5.0.0"
targets:
  Kamera:
    type: application
    platform: macOS
    sources:
      - Sources/Kamera
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kamera.app
        INFOPLIST_FILE: Support/Info.plist
        CODE_SIGN_ENTITLEMENTS: Support/Kamera.entitlements
        CODE_SIGN_STYLE: Automatic
        MACOSX_DEPLOYMENT_TARGET: "14.4"
    dependencies:
      - package: Yams
  KameraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - Tests/KameraTests
    dependencies:
      - target: Kamera
