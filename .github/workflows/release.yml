name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build DMG
        run: make dmg

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/Kamera.dmg
          generate_release_notes: true
